name: qdlrate
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds each job runs'
        default: '1500'
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: r2.0-a, rate: 2.0, offset: 0, count: 4000}
          - {label: r2.5-a, rate: 2.5, offset: 6000, count: 5000}
          - {label: r2.5-b, rate: 2.5, offset: 12000, count: 5000}
          - {label: r3.0-a, rate: 3.0, offset: 18000, count: 6000}
          - {label: r3.0-b, rate: 3.0, offset: 25000, count: 6000}
          - {label: r3.5-a, rate: 3.5, offset: 32000, count: 7000}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi==0.17.0
      - run: python -u qdlprobe.py --label ${{ matrix.label }} --rate ${{ matrix.rate }} --offset ${{ matrix.offset }} --count ${{ matrix.count }} --seconds ${{ github.event.inputs.seconds || '1500' }}
